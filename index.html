<!doctype html>
<html lang="ru" data-skin="creme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой ритм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Onest:wght@400;500;600;700&display=swap&subset=cyrillic">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Две темы на палитре #1E100F #F6F3E4 #30050E #4D0C12: День (крем) и Ночь (бордо). Cormorant — заголовки, цифры и фраза; Onest — текст */
:root{
  --f-body:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-voice:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-pill:999px;

  /* День — крем и бордо (значения по умолчанию) */
  --bg:#F6F3E4; --sheet-bg:#FBF9F0;
  --body-bg:radial-gradient(70% 40% at 95% 0%,rgba(77,12,18,.07) 0%,rgba(77,12,18,0) 70%),radial-gradient(80% 40% at 0% 100%,rgba(77,12,18,.05) 0%,rgba(77,12,18,0) 70%),#F6F3E4;
  --glass:rgba(255,253,246,.78); --glass-border:rgba(30,16,15,.07); --glass-2:#FFFDF6; --field-bg:#FFFDF6;
  --line:rgba(30,16,15,.08); --line-2:rgba(30,16,15,.22); --track:rgba(30,16,15,.07);
  --ink:#1E100F; --ink-2:#4a3533; --muted:#8d7b74; --future:#c9bfb2;
  --accent:#4D0C12; --accent-2:#4D0C12; --accent-rgb:77,12,18; --accent-soft:rgba(77,12,18,.08); --accent-glow:rgba(77,12,18,.25); --full-ink:#F6F3E4;
  --done-bg:linear-gradient(135deg,#5a1218,#30050E); --done-border:transparent; --done-ink:#F6F3E4; --done-sub:rgba(246,243,228,.72);
  --done-chip-bg:rgba(246,243,228,.12); --done-chip-ink:#F6F3E4; --done-check-bg:#F6F3E4; --done-check-ink:#4D0C12;
  --water:#B9858A; --water-2:#8E4F55; --water-top:#D6AEB0; --water-soft:rgba(185,133,138,.16); --water-glow:rgba(185,133,138,.35);
  --btn:#1E100F; --btn-ink:#F6F3E4; --btn-ic-bg:#F6F3E4; --btn-ic-ink:#4D0C12;
  --shadow:0 10px 30px -18px rgba(30,16,15,.35);
  --phrase:#4D0C12; --chip-dot:#4D0C12; --photo-bg:#F6F3E4;
  --cell-bg:rgba(255,253,246,.85); --nav-bg:rgba(255,253,246,.9); --backdrop:rgba(30,16,15,.35); --veil:rgba(246,243,228,.78);
  --cel-bg:linear-gradient(160deg,#4D0C12,#30050E); --cel-ink:#F6F3E4; --cel-sub:rgba(246,243,228,.75); --orb-bg:#F6F3E4; --orb-ink:#4D0C12;
  --skel-a:#ebe6d3; --skel-b:#f8f5ea;
  color-scheme:light;
}
:root[data-skin="nuit"]{
  --bg:#1E100F; --sheet-bg:#2a1513;
  --body-bg:radial-gradient(80% 45% at 90% 0%,rgba(77,12,18,.65) 0%,rgba(77,12,18,0) 70%),radial-gradient(80% 45% at 0% 100%,rgba(48,5,14,.75) 0%,rgba(48,5,14,0) 70%),#1E100F;
  --glass:rgba(246,243,228,.05); --glass-border:rgba(246,243,228,.08); --glass-2:rgba(246,243,228,.07); --field-bg:rgba(246,243,228,.06);
  --line:rgba(246,243,228,.09); --line-2:rgba(246,243,228,.22); --track:rgba(246,243,228,.08);
  --ink:#F6F3E4; --ink-2:#d8cfc0; --muted:#a08f85; --future:#5e4844;
  --accent:#F6F3E4; --accent-2:#F6F3E4; --accent-rgb:246,243,228; --accent-soft:rgba(246,243,228,.1); --accent-glow:rgba(246,243,228,.15); --full-ink:#30050E;
  --done-bg:linear-gradient(135deg,#6a1720,#4D0C12); --done-border:rgba(246,243,228,.12); --done-ink:#F6F3E4; --done-sub:rgba(246,243,228,.7);
  --done-chip-bg:rgba(246,243,228,.12); --done-chip-ink:#F6F3E4; --done-check-bg:#F6F3E4; --done-check-ink:#4D0C12;
  --water:#C9969A; --water-2:#E0B7B9; --water-top:#E7C6C8; --water-soft:rgba(201,150,154,.15); --water-glow:rgba(201,150,154,.3);
  --btn:#F6F3E4; --btn-ink:#1E100F; --btn-ic-bg:#4D0C12; --btn-ic-ink:#F6F3E4;
  --shadow:0 12px 30px -16px rgba(0,0,0,.6);
  --phrase:#F6F3E4; --chip-dot:#C9969A; --photo-bg:#8f877a;
  --cell-bg:rgba(246,243,228,.05); --nav-bg:rgba(42,21,19,.9); --backdrop:rgba(0,0,0,.55); --veil:rgba(30,16,15,.78);
  --cel-bg:linear-gradient(160deg,#4D0C12,#30050E); --cel-ink:#F6F3E4; --cel-sub:rgba(246,243,228,.75); --orb-bg:#F6F3E4; --orb-ink:#4D0C12;
  --skel-a:#2a1715; --skel-b:#3a201d;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);min-height:100vh;-webkit-font-smoothing:antialiased;background:var(--body-bg);background-attachment:fixed;transition:background .4s}
button,textarea,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.section{margin-top:12px}
.label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.fn{font-family:var(--f-num)}
[hidden]{display:none!important}

/* Banner — редакционная обложка: фото на кремовом поле, фраза под ним */
.banner{border-radius:var(--r-xl);overflow:hidden;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.banner .ph{position:relative;height:auto;aspect-ratio:760/820;max-width:100%;overflow:hidden}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0%;mix-blend-mode:multiply;filter:contrast(1.03)}
.banner .txt{padding:16px 20px 20px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip i{width:5px;height:5px;border-radius:50%;background:var(--chip-dot)}
.phrase{font-family:var(--f-voice);font-style:italic;font-weight:500;font-size:34px;line-height:1.05;letter-spacing:-.01em;margin-top:8px;color:var(--phrase);text-wrap:balance}
.skin-btn{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#1E100F;background:rgba(246,243,228,.78);border:1px solid rgba(30,16,15,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s}
.skin-btn:active{transform:scale(.9)}

/* Today */
.today{border-radius:var(--r-xl);padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow),transparent 65%);opacity:.7;pointer-events:none}
.today .big{font-family:var(--f-num);font-size:58px;font-weight:500;letter-spacing:-.02em;line-height:1}
.today .big small{font-family:var(--f-body);font-size:16px;color:var(--muted);font-weight:600;letter-spacing:0}
.today .sub{font-size:13px;color:var(--ink-2);margin-top:12px;display:flex;align-items:center;gap:6px;font-weight:500}
.today .sub svg{color:var(--accent)}
.ring{width:92px;height:92px;flex:0 0 92px;position:relative;z-index:1}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:24px;color:var(--ink)}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.glow-o{filter:drop-shadow(0 2px 6px var(--accent-glow))}
.glow-y{filter:drop-shadow(0 2px 6px var(--water-glow))}

/* Week */
.week{border-radius:var(--r-lg);padding:14px 10px;display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:7px;width:13.5%}
.day .dn{font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.day .dot{width:36px;height:36px;position:relative;display:grid;place-items:center}
.day .dot svg{position:absolute;inset:0;transform:rotate(-90deg)}
.day .dot b{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.day.full .dot b{background:var(--accent);color:var(--full-ink);box-shadow:0 4px 12px -2px var(--accent-glow)}
.day.is-today .dot b{border:1.5px solid var(--ink)}
.day.is-today .dn{color:var(--ink)}

/* Water */
.water{border-radius:var(--r-xl);padding:18px;position:relative;overflow:hidden}
.water-top{display:flex;justify-content:space-between;align-items:flex-start}
.water .val{font-family:var(--f-num);font-size:50px;font-weight:500;letter-spacing:-.02em;line-height:1;margin-top:8px}
.water .val small{font-family:var(--f-body);font-size:16px;color:var(--muted);font-weight:600;letter-spacing:0}
.segs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:16px 0}
.seg{height:34px;border-radius:10px;background:var(--track);position:relative;overflow:hidden}
.seg i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--water-top),var(--water));border-radius:10px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.seg.on i{height:100%}
.seg.on{box-shadow:0 4px 12px -4px var(--water-glow)}
.water-actions{display:flex;gap:8px}
.pill-btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 6px;border-radius:var(--r-pill);background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:15px;transition:transform .15s}
.pill-btn:active{transform:scale(.96)}
.pill-btn .ic{width:40px;height:40px;border-radius:50%;background:var(--btn-ic-bg);color:var(--btn-ic-ink);display:grid;place-items:center}
.round-btn{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.round-btn:active{transform:scale(.92)}
.flex1{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:var(--r-pill)}
.badge.y{background:var(--water-soft);color:var(--water-2)}

/* Habits */
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.list-head h2{margin:0;font-family:var(--f-num);font-size:26px;letter-spacing:-.01em;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.habit{border-radius:var(--r-lg);padding:12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:transform .15s,background .25s,border-color .25s,color .25s}
.habit:active{transform:scale(.98)}
.hic{width:46px;height:46px;flex:0 0 46px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent-2);transition:all .25s}
.habit .ht{flex:1;min-width:0}
.habit .ht b{display:block;font-size:16px;font-weight:700}
.habit .ht span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.streak{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--accent-2);padding:4px 8px;border-radius:var(--r-pill);background:var(--accent-soft)}
.check{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:all .25s;color:var(--done-check-ink)}
.check svg{opacity:0;transform:scale(.5);transition:all .25s}
.arrow{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2)}
.habit.done,.wcard.done{background:var(--done-bg);border-color:var(--done-border);color:var(--done-ink);box-shadow:0 12px 26px -14px var(--accent-glow)}
.habit.done .hic,.wcard.done .hic{background:var(--done-chip-bg);border-color:transparent;color:var(--done-chip-ink)}
.habit.done .ht span,.wcard.done span.s{color:var(--done-sub)}
.habit.done .streak,.wcard.done .tag{background:var(--done-chip-bg);color:var(--done-chip-ink)}
.habit.done .check{background:var(--done-check-bg);border-color:var(--done-check-bg)}
.habit.done .check svg{opacity:1;transform:scale(1)}
.habit.done .arrow{background:var(--done-check-bg);color:var(--done-check-ink)}
.habit.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.025)}}
.mini-bar{height:4px;border-radius:4px;background:var(--track);margin-top:7px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.habit.done .mini-bar{background:var(--done-chip-bg)}
.habit.done .mini-bar i{background:var(--done-check-bg)}

/* Weekly */
.weekly{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcard{border-radius:var(--r-lg);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
button.wcard:active{transform:scale(.97)}
.wcard .row{display:flex;justify-content:space-between;align-items:center}
.wcard .hic{width:40px;height:40px;flex:0 0 40px;border-radius:14px}
.wcard b{font-size:15px;font-weight:700}
.wcard span.s{font-size:12px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:6px;border-radius:6px;background:var(--track)}
.dots i.on{background:var(--accent)}
.wcard.done .dots i{background:var(--done-chip-bg)} .wcard.done .dots i.on{background:var(--done-check-bg)}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-2)}
.tag.on{background:var(--accent);color:var(--full-ink)}

/* Note */
.note{border-radius:var(--r-lg);padding:14px}
.note textarea{width:100%;min-height:76px;resize:none;border:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.45;outline:none;padding:6px 2px 0;font-weight:500}
.note textarea::placeholder{color:var(--muted)}
.note .row{display:flex;justify-content:space-between;align-items:center}
.saved{font-size:12px;color:var(--accent-2);font-weight:600;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* Rows — привычки списком, как оглавление */
.hlist{border-radius:var(--r-xl);padding:2px 18px 6px}
.grp{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}
.hrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line);transition:opacity .15s}
.grp+.hrow,.hlist>.hrow:first-child{border-top:0}
.hrow:active{opacity:.65}
.hrow .hi{width:22px;flex:0 0 22px;color:var(--muted);display:grid;place-items:center;transition:color .25s}
.hrow .hi svg{width:20px;height:20px}
.hrow .ht{flex:1;min-width:0}
.hrow .ht b{display:block;font-size:16px;font-weight:600;line-height:1.25;transition:color .25s}
.hrow .ht>span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hrow.done .ht b{font-family:var(--f-voice);font-style:italic;font-weight:600;font-size:21px;line-height:1.1;color:var(--accent-2)}
.hrow.done .hi{color:var(--accent-2)}
.hrow .mini-bar{display:block;max-width:180px}
.ck{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--full-ink);transition:all .25s}
.ck svg{opacity:0;transform:scale(.5);transition:all .25s}
.hrow.done .ck{background:var(--accent);border-color:var(--accent)}
.hrow.done .ck svg{opacity:1;transform:none}
.chev{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;color:var(--muted)}
.hrow .dots{flex:0 0 auto}
.hrow .when{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.hrow.pop{animation:pop .35s}
.today{flex-direction:column;align-items:stretch;gap:0}
.top-row{display:flex;gap:16px;align-items:center}
.week-row{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);position:relative;z-index:1}
.banner .ph{background:var(--photo-bg)}
:root[data-skin="nuit"] .banner img{filter:contrast(1.06) brightness(.92)}

/* Day editor */
.edit-day{width:100%;justify-content:center;margin-top:14px;padding:0 22px}
.ed{display:flex;flex-direction:column;max-height:52vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.ed-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ed>.ed-row:first-child{border-top:0}
.ed-row .hi,.ed-lbl .hi{width:22px;flex:0 0 22px;color:var(--muted);display:grid;place-items:center}
.ed-row .ht{flex:1;min-width:0}
.ed-row .ht b{display:block;font-size:15px;font-weight:600}
.ed-row .ht span{display:block;font-size:13px;color:var(--muted);font-weight:500}
.mini-step{display:flex;gap:6px}
.mini-step button{min-width:40px;height:36px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--field-bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent-2)}
.ed-block{padding:12px 0;border-top:1px solid var(--line)}
.ed-lbl{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-left:36px}
.chip-opt{height:34px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--field-bg);font-size:13px;font-weight:600}
.chip-opt.sel{background:var(--accent);border-color:var(--accent);color:var(--full-ink)}
.ed-check{padding:12px 0}

/* Gratitude */
.grat{border-radius:var(--r-lg);padding:14px 16px 8px;transition:background .3s,border-color .3s}
.grat .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.grat .label{font-family:var(--f-voice);font-style:italic;font-size:17px;letter-spacing:0;font-weight:500;color:var(--ink-2)}
.gline{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.gline:first-of-type{border-top:0}
.gn{font-family:var(--f-voice);font-style:italic;font-size:20px;width:22px;flex:0 0 22px;color:var(--accent-2);text-align:right}
.gline input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;font-weight:500;color:var(--ink);outline:none;padding:2px 0}
.gline input::placeholder{color:var(--muted);font-weight:400}
.grat.done{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
.dgrat{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line)}
.dgrat ol{margin:6px 0 0;padding-left:22px;font-family:var(--f-voice);font-style:italic;font-size:18px;line-height:1.35;color:var(--ink)}
.dgrat li{padding:2px 0}

/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 14px}
.cal-head h1{margin:0;font-family:var(--f-num);font-size:34px;letter-spacing:-.01em;font-weight:600;text-transform:capitalize}
.cal-nav{display:flex;gap:8px}
.cal-nav .round-btn{width:42px;height:42px;flex:0 0 42px}
.cal{border-radius:var(--r-xl);padding:14px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd span{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cell{width:100%;min-width:0;padding:0;aspect-ratio:1;max-width:100%;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;position:relative;background:var(--cell-bg);border:1px solid var(--line);color:var(--ink);transition:transform .15s}
.cell:active{transform:scale(.92)}
.cell.future{color:var(--future)}
.cell.full{background:var(--accent)!important;color:var(--full-ink);border-color:var(--accent);box-shadow:0 6px 14px -6px var(--accent-glow)}
.cell.today{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.cell.sel{outline:2px solid var(--water);outline-offset:-2px}
.cell .nd{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--water-2)}
.cell.full .nd{background:var(--full-ink)}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted);font-weight:500}
.legend i{width:14px;height:14px;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{border-radius:var(--r-md);padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);font-weight:500}
.stat.o b{color:var(--accent-2)} .stat.y b{color:var(--water-2)}
.chart{border-radius:var(--r-xl);padding:16px 16px 10px;margin-top:12px}
.chart svg{display:block;width:100%;height:auto}
.detail{border-radius:var(--r-xl);padding:16px;margin-top:12px}
.detail h3{margin:0 0 12px;font-family:var(--f-num);font-size:23px;font-weight:600;letter-spacing:-.01em}
.drow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:500}
.drow:first-of-type{border-top:0}
.drow .v{color:var(--muted)}
.drow .v.ok{color:var(--accent-2);font-weight:700}
.drow .v.wy{color:var(--water-2);font-weight:700}
.dnote{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-family:var(--f-voice);font-style:italic;font-size:18px;line-height:1.35;color:var(--ink)}

/* Nav */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:5px;border-radius:var(--r-pill);background:var(--nav-bg);border:1px solid var(--glass-border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.nav button{height:46px;padding:0 18px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);transition:all .2s}
.nav button.on{background:var(--btn);color:var(--btn-ink)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--sheet-bg);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-family:var(--f-num);font-size:28px;font-weight:600;letter-spacing:-.01em}
.sheet p.s{margin:0 0 16px;color:var(--muted);font-size:13px;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{height:64px;border-radius:var(--r-md);background:var(--field-bg);border:1px solid var(--line);font-weight:700;font-size:15px;transition:all .2s}
.opt.sel{background:var(--accent);color:var(--full-ink);border-color:var(--accent);box-shadow:0 10px 20px -10px var(--accent-glow)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--field-bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.stepper .n{font-family:var(--f-num);font-size:54px;font-weight:500;letter-spacing:-.03em;text-align:center;flex:1}
.stepper .n small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:4px}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;height:42px;border-radius:var(--r-pill);background:var(--field-bg);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--accent-2)}
.field{margin-top:16px}
.field label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:0 0 6px 4px}
.field input{width:100%;height:50px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--field-bg);padding:0 14px;font-size:15px;font-weight:500;outline:none}
.field input:focus{border-color:var(--accent)}
.book-stats{display:flex;gap:8px;margin-top:12px}
.book-stats div{flex:1;background:var(--field-bg);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.book-stats b{display:block;font-family:var(--f-num);font-size:26px;font-weight:600}
.book-stats span{font-size:11px;color:var(--muted);font-weight:500}
.sheet .save{width:100%;justify-content:center;margin-top:16px;padding:0 22px}
.link-btn{display:block;margin:12px auto 0;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.skins{display:flex;flex-direction:column;gap:8px}
.skin{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--field-bg);text-align:left;width:100%;transition:border-color .2s}
.skin.sel{border-color:var(--accent)}
.skin .sw{width:64px;height:48px;flex:0 0 64px;border-radius:14px;position:relative;overflow:hidden}
.skin .sw i{position:absolute;width:22px;height:22px;border-radius:50%;bottom:8px}
.skin b{display:block;font-size:15px;font-weight:700}
.skin span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.skin .ok{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--full-ink);opacity:0}
.skin.sel .ok{opacity:1}

/* Celebrate */
.celebrate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .3s}
.celebrate.show{opacity:1;pointer-events:auto}
.celebrate .bg{position:absolute;inset:0;background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cel-card{position:relative;background:var(--cel-bg);color:var(--cel-ink);border:1px solid var(--done-border);border-radius:32px;padding:30px 28px;text-align:center;width:min(82vw,320px);transform:scale(.85);transition:transform .45s cubic-bezier(.2,1.4,.3,1);box-shadow:0 30px 60px -20px var(--accent-glow)}
.celebrate.show .cel-card{transform:scale(1)}
.cel-card .orb{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;background:var(--orb-bg);color:var(--orb-ink);display:grid;place-items:center}
.cel-card h4{margin:0;font-family:var(--f-num);font-size:32px;font-weight:600;letter-spacing:-.02em}
.cel-card p{margin:8px 0 18px;color:var(--cel-sub);font-size:14px;font-weight:500}
.cel-card button{height:46px;padding:0 24px;border-radius:var(--r-pill);background:var(--orb-bg);color:var(--orb-ink);font-weight:700}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0}
.celebrate.show .spark{animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--btn);color:var(--btn-ink);font-size:14px;font-weight:700;padding:12px 18px;border-radius:var(--r-pill);opacity:0;transition:all .3s;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.skeleton{border-radius:var(--r-lg);height:80px;margin-top:12px;background:linear-gradient(90deg,var(--skel-a) 0%,var(--skel-b) 50%,var(--skel-a) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{border-radius:var(--r-xl);padding:28px 22px;text-align:center;margin-top:12px}
.empty .orb{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty h3{margin:0;font-family:var(--f-num);font-size:26px;font-weight:600}
.empty p{margin:8px 0 18px;color:var(--muted);font-size:14px;line-height:1.45;font-weight:500}
.foot{text-align:center;color:var(--muted);font-size:11px;font-weight:500;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

};
document.getElementById('navToday').innerHTML=I.sun+'Сегодня';
document.getElementById('navCal').innerHTML=I.cal+'Календарь';

/* ---------- Dates ---------- */
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_N=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var MONTHS_P=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var WD_SHORT=['вс','пн','вт','ср','чт','пт','сб'];
function pad(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var TODAY=addDays(new Date(),0), TK=key(TODAY);
function weekStart(d){return addDays(d,-((d.getDay()+6)%7))}
function monthKey(y,m){return 'log_'+y+'_'+pad(m+1)}
function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function plural(n,a,b,c){var m=n%10,mm=n%100;if(m===1&&mm!==11)return a;if(m>=2&&m<=4&&(mm<12||mm>14))return b;return c}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- Storage: Telegram CloudStorage → localStorage → память ---------- */
var mem={};
var cloud=(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'))?tg.CloudStorage:null;
function lGet(k){try{var v=localStorage.getItem('rhythm_'+k);if(v!==null)return v;}catch(e){}return mem.hasOwnProperty(k)?mem[k]:null}
function sGet(k){return new Promise(function(res){if(cloud){try{cloud.getItem(k,function(err,v){res(err?lGet(k):(v||lGet(k)))});return}catch(e){}}res(lGet(k))})}
function sGetMany(keys){
  return new Promise(function(res){
    var out={};
    function local(){keys.forEach(function(k){var v=lGet(k);if(v)out[k]=v});res(out)}
    if(cloud&&cloud.getItems){try{cloud.getItems(keys,function(err,vals){if(err||!vals){local();return}keys.forEach(function(k){var v=vals[k]||lGet(k);if(v)out[k]=v});res(out)});return}catch(e){}}
    local();
  });
}
function sSet(k,v){mem[k]=v;try{localStorage.setItem('rhythm_'+k,v)}catch(e){}if(cloud){try{cloud.setItem(k,v,function(){})}catch(e){}}}
function sDel(k){delete mem[k];try{localStorage.removeItem('rhythm_'+k)}catch(e){}if(cloud){try{cloud.removeItem(k,function(){})}catch(e){}}}

/* ---------- State ---------- */
var DATA=null, LOG={}, NOTES={}, GRAT={}, BOOK=null, habitsById={}, loadedMonths={};
var VIEW='today', CAL_Y=TODAY.getFullYear(), CAL_M=TODAY.getMonth(), CAL_SEL=TK;

function dayRec(k){if(!LOG[k])LOG[k]={};return LOG[k]}
function saveMonthOf(k){
  var prefix=k.slice(0,7), d=fromKey(k), out={};
  Object.keys(LOG).forEach(function(x){if(x.indexOf(prefix)===0)out[x]=LOG[x]});
  sSet(monthKey(d.getFullYear(),d.getMonth()),JSON.stringify(out));
  syncDay(k);
}
function saveBook(){sSet('book',JSON.stringify(BOOK))}

function loadMonth(y,m){
  var mk=monthKey(y,m);
  if(loadedMonths[mk]) return Promise.resolve();
  loadedMonths[mk]=true;
  var noteKeys=[],gKeys=[];for(var i=1;i<=daysIn(y,m);i++){var dk=y+'-'+pad(m+1)+'-'+pad(i);noteKeys.push('n_'+dk);gKeys.push('g_'+dk)}
  return Promise.all([sGet(mk),sGetMany(noteKeys),sGetMany(gKeys)]).then(function(v){
    Object.keys(v[2]).forEach(function(gk){try{var a=JSON.parse(v[2][gk]);if(Array.isArray(a))GRAT[gk.slice(2)]=a}catch(e){}});
    if(v[0]){try{var o=JSON.parse(v[0]);Object.keys(o).forEach(function(k){LOG[k]=o[k]})}catch(e){}}
    Object.keys(v[1]).forEach(function(nk){NOTES[nk.slice(2)]=v[1][nk]});
  });
}

/* ---------- Logic ---------- */
function isDone(h,r){
  r=r||{};var S=DATA.settings;
  switch(h.type){
    case 'counter':return (r.water||0)>=S.water.goalMl;
    case 'pages':return (r.pages||0)>=S.reading.goalPages;
    case 'gratitude':return (r.gratitude||0)>=(h.count||3);
    default:return !!r[h.id];
  }
}
function appliesDaily(h,d){if(h.type==='weekly')return false;if(h.type==='weekday')return d.getDay()===h.weekday;return true}
function dayStats(d){
  var r=LOG[key(d)]||{},total=0,done=0;
  DATA.habits.forEach(function(h){if(appliesDaily(h,d)){total++;if(isDone(h,r))done++}});
  return {total:total,done:done,ratio:total?done/total:0,any:Object.keys(r).length>0};
}
function streakFor(h){
  if(h.type==='weekly'||h.type==='weekday')return 0;
  var n=0,d=TODAY;if(!isDone(h,LOG[key(d)]))d=addDays(d,-1);
  for(var i=0;i<400;i++){var r=LOG[key(d)];if(!isDone(h,r))break;n++;d=addDays(d,-1)}
  return n;
}
function perfectStreak(){
  var n=0,d=TODAY;if(dayStats(d).ratio<1)d=addDays(d,-1);
  for(var i=0;i<400;i++){var s=dayStats(d);if(!s.total||s.ratio<1)break;n++;d=addDays(d,-1)}
  return n;
}
function weeklyCount(h){var ws=weekStart(TODAY),c=0;for(var i=0;i<7;i++){var r=LOG[key(addDays(ws,i))];if(r&&r[h.id])c++}return c}
function workoutLabel(id){var h=habitsById.workout;if(!h)return '';var o=(h.options||[]).filter(function(x){return x.id===id})[0];return o?o.label:''}
function fmtL(ml){var l=ml/1000;return (Math.round(l*100)/100).toString().replace('.',',')}

function ringSvg(size,stroke,ratio,track,color,cls){
  var r=(size-stroke)/2,c=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'"'+(cls?' class="'+cls+'"':'')+'><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:'+track+'" stroke-width="'+stroke+'"/>'+
  (ratio>0?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+(c*(1-Math.min(1,ratio))).toFixed(2)+'"/>':'')+'</svg>';
}

/* ---------- Header ---------- */
function header(){
  var wd=WD[TODAY.getDay()];
  document.getElementById('dateChip').textContent=wd.charAt(0).toUpperCase()+wd.slice(1)+', '+TODAY.getDate()+' '+MONTHS[TODAY.getMonth()];
  var ph=(DATA&&Array.isArray(DATA.phrases)&&DATA.phrases.length)?DATA.phrases:['Мой ритм'];
  var dayNum=Math.floor(Date.UTC(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())/864e5);
  document.getElementById('phrase').textContent=ph[dayNum%ph.length];
}

/* ---------- Today view ---------- */
var $app=document.getElementById('app');
function renderToday(){
  var S=DATA.settings,r=dayRec(TK),html='';

  html+='<div id="topBox">'+topHtml()+'</div>';

  var w=r.water||0,goal=S.water.goalMl,step=S.water.stepMl,segs=Math.round(goal/step);
  html+='<section class="section water glass"><div class="water-top"><div><div class="label">Вода</div>'+
   '<div class="val num">'+fmtL(w)+' <small>/ '+fmtL(goal)+' л</small></div></div>'+
   (w>=goal?'<span class="badge y">'+I.check+' Норма</span>':'<span class="label num">ещё '+(goal-w)+' мл</span>')+'</div><div class="segs">';
  for(var s=0;s<segs;s++)html+='<div class="seg'+(w>=(s+1)*step?' on':'')+'"><i></i></div>';
  html+='</div><div class="water-actions"><button class="pill-btn flex1" data-act="water+"><span class="ic">'+I.plus+'</span>'+step+' мл</button>'+
   '<button class="round-btn" data-act="water-" aria-label="Убрать стакан">'+I.minus+'</button></div></section>';

  var list=DATA.habits.filter(function(h){return h.type!=='counter'&&h.type!=='weekly'&&h.type!=='gratitude'&&appliesDaily(h,TODAY)});
  var dc=list.filter(function(h){return isDone(h,r)}).length;
  html+='<div class="list-head"><h2>Привычки на сегодня</h2><span class="label num">'+dc+' / '+list.length+'</span></div><section class="hlist glass">';
  var GROUPS=[['morning','Утро'],['day','День'],['evening','Вечер']],used={};
  GROUPS.forEach(function(g){
    var items=list.filter(function(h){return (h.time||'day')===g[0]});
    if(!items.length)return;
    html+='<div class="grp">'+g[1]+'</div>';
    items.forEach(function(h){used[h.id]=1;html+=habitCard(h,r)});
  });
  var rest=list.filter(function(h){return !used[h.id]});
  if(rest.length){html+='<div class="grp">Ещё</div>';rest.forEach(function(h){html+=habitCard(h,r)})}
  html+='</section>';

  html+=gratitudeHtml();

  var weekly=DATA.habits.filter(function(h){return h.type==='weekly'||(h.type==='weekday'&&TODAY.getDay()!==h.weekday)});
  if(weekly.length){
    html+='<div class="list-head"><h2>На этой неделе</h2></div><section class="hlist glass">';
    weekly.forEach(function(h){
      if(h.type==='weekly'){
        var c=weeklyCount(h),on=!!r[h.id],full=c>=h.timesPerWeek;
        html+='<button class="hrow'+(full?' done':'')+'" data-act="weekly" data-id="'+h.id+'"><span class="hi">'+I[h.icon]+'</span>'+
         '<span class="ht"><b>'+esc(h.title)+'</b><span class="num">'+c+' из '+h.timesPerWeek+' на этой неделе'+(on?' · сегодня ✓':'')+'</span></span>'+
         '<span class="dots">'+Array.apply(null,{length:h.timesPerWeek}).map(function(_,j){return '<i class="'+(j<c?'on':'')+'"></i>'}).join('')+'</span></button>';
      }else{
        var last=addDays(TODAY,-((TODAY.getDay()-h.weekday+7)%7)),dl=!!(LOG[key(last)]&&LOG[key(last)][h.id]),to=(h.weekday-TODAY.getDay()+7)%7;
        html+='<div class="hrow"><span class="hi">'+I[h.icon]+'</span><span class="ht"><b>'+esc(h.title)+'</b><span>'+(dl?'В прошлое воскресенье — ✓':'В прошлое воскресенье — пропуск')+'</span></span>'+
         '<span class="when num">через '+to+' '+plural(to,'день','дня','дней')+'</span></div>';
      }
    });
    html+='</section>';
  }

  var max=S.noteMaxLength||200,nt=NOTES[TK]||'';
  html+='<div class="list-head"><h2>Заметка дня</h2></div>'+
   '<section class="note glass"><div class="row"><span class="label">Как прошёл день?</span><span class="saved" id="savedLbl">Сохранено</span></div>'+
   '<textarea id="noteIn" maxlength="'+max+'" placeholder="Пара слов: самочувствие, тренировка, настроение">'+esc(nt)+'</textarea>'+
   '<div class="row"><span></span><span class="label num" id="noteCnt">'+nt.length+' / '+max+'</span></div></section>';

  html+='<div class="foot">'+(S.demoMode?'Демо-режим: прошлые дни заполнены примерами из data.json':'Данные сохраняются в твоём Telegram')+'</div>';
  $app.innerHTML=html;
  bindNote();bindGratitude();
}

function habitCard(h,r){
  var done=isDone(h,r),S=DATA.settings,sub=h.subtitle,extra='',act,right;
  if(h.type==='choice'){sub=r[h.id]?workoutLabel(r[h.id]):'Нажми и выбери тип';act='choice'}
  else if(h.type==='pages'){var p=r.pages||0,g=S.reading.goalPages;sub=(BOOK&&BOOK.title?'«'+BOOK.title+'» · ':'')+p+' из '+g+' стр.';if(!done)extra='<span class="mini-bar"><i style="width:'+Math.min(100,p/g*100)+'%"></i></span>';act='pages'}
  else act='toggle';
  right=(act==='toggle'||done)?'<span class="ck">'+I.check+'</span>':'<span class="chev">'+I.right+'</span>';
  return '<button class="hrow'+(done?' done':'')+'" data-act="'+act+'" data-id="'+h.id+'"><span class="hi">'+I[h.icon]+'</span>'+
   '<span class="ht"><b>'+esc(h.title)+'</b><span>'+esc(sub)+'</span>'+extra+'</span>'+right+'</button>';
}

var noteTimer;
function bindNote(){
  var t=document.getElementById('noteIn');if(!t)return;
  t.addEventListener('input',function(){
    document.getElementById('noteCnt').textContent=t.value.length+' / '+(DATA.settings.noteMaxLength||200);
    clearTimeout(noteTimer);noteTimer=setTimeout(function(){saveNote(TK,t.value)},600);
  });
  t.addEventListener('blur',function(){clearTimeout(noteTimer);saveNote(TK,t.value)});
}
function saveNote(k,v){
  v=v.trim();
  if((NOTES[k]||'')===v)return;
  if(v){NOTES[k]=v;sSet('n_'+k,v)}else{delete NOTES[k];sDel('n_'+k)}
  var l=document.getElementById('savedLbl');if(l){l.classList.add('show');setTimeout(function(){l.classList.remove('show')},1200)}
}


/* ---------- Top (today + week) ---------- */
function topHtml(){
  var st=dayStats(TODAY),ps=perfectStreak(),html='<section class="section today glass"><div class="top-row">'+
   '<div style="flex:1;position:relative;z-index:1"><div class="label">Сегодня</div>'+
   '<div class="big num" style="margin-top:6px">'+st.done+' <small>из '+st.total+'</small></div>'+
   '<div class="sub">'+I.flame+' '+(ps>0?ps+' '+plural(ps,'полный день','полных дня','полных дней')+' подряд':'Закрой день — начнётся серия')+'</div></div>'+
   '<div class="ring">'+ringSvg(88,6,st.ratio,'var(--track)','var(--accent)','glow-o')+'<div class="pct num">'+Math.round(st.ratio*100)+'%</div></div></div><div class="week-row">';
  for(var i=6;i>=0;i--){
    var d=addDays(TODAY,-i),ds=dayStats(d),isT=i===0,full=ds.ratio>=1;
    html+='<div class="day'+(isT?' is-today':'')+(full?' full':'')+'"><div class="dn">'+WD_SHORT[d.getDay()]+'</div><div class="dot">'+
      (full?'':ringSvg(36,2.5,ds.ratio,'var(--track)','var(--accent)'))+'<b class="num">'+d.getDate()+'</b></div></div>';
  }
  return html+'</div></section>';

var gratTimer;

  var box=document.getElementById('gratBox');if(!box)return;

    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var nx=document.getElementById('grat'+(+inp.getAttribute('data-g')+1));if(nx)nx.focus();else inp.blur()}});

function saveGratitude(){
  var h=gratHabit(),box=document.getElementById('gratBox');if(!h||!box)return;
  var n=h.count||3,arr=[];for(var i=0;i<n;i++){var el=document.getElementById('grat'+i);arr.push(el?el.value.trim():'')}
  var prev=JSON.stringify(GRAT[TK]||[]);if(prev===JSON.stringify(arr))return;
  var filled=arr.filter(function(x){return x}).length,r=dayRec(TK),before=(r.gratitude||0)>=n;
  GRAT[TK]=arr;if(filled)sSet('g_'+TK,JSON.stringify(arr));else sDel('g_'+TK);
  r.gratitude=filled;saveMonthOf(TK);

  box.classList.toggle('done',filled>=n);

function waterChart(series,n){
  var goal=DATA.settings.water.goalMl,W=340,H=120,pl=26,pr=8,pt=12,pb=20,max=Math.max(goal*1.25,1);
  function x(d){return pl+(d-1)/(Math.max(n-1,1))*(W-pl-pr)}
  function yv(v){return pt+(1-v/max)*(H-pt-pb)}
  var pts=series.map(function(p){return [x(p.d),yv(p.v)]}),path='',area='';
  if(pts.length){
    path='M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L');
    area=path+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-pb)+' L'+pts[0][0].toFixed(1)+' '+(H-pb)+' Z';
  }
  var gy=yv(goal),last=pts[pts.length-1];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Вода по дням месяца"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--water);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--water);stop-opacity:0"/></linearGradient></defs>'+
   '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" style="stroke:var(--line-2)" stroke-dasharray="3 4"/>'+
   '<text x="0" y="'+(gy+4)+'" style="fill:var(--muted)" font-size="10">2 л</text>'+
   '<text x="0" y="'+(H-pb+4)+'" style="fill:var(--muted)" font-size="10">0</text>'+
   '<text x="'+pl+'" y="'+(H-4)+'" style="fill:var(--muted)" font-size="10">1</text>'+
   '<text x="'+(W-pr)+'" y="'+(H-4)+'" style="fill:var(--muted)" font-size="10" text-anchor="end">'+n+'</text>'+
   (area?'<path d="'+area+'" fill="url(#wg)"/>':'')+
   (path?'<path d="'+path+'" fill="none" style="stroke:var(--water)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="glow-y"/>':'')+
   (last?'<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4" style="fill:var(--water);stroke:var(--bg)" stroke-width="2"/>':'')+'</svg>';
  return '<section class="chart glass"><div class="row" style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="label">Вода по дням</span><span class="badge y">цель 2 л</span></div>'+svg+'</section>';
}

function dayDetail(k){

      }else if(hb.type==='pages'){

      }else{

      Object.keys(r).forEach(function(x){if(r[x]===0||r[x]===false)delete r[x]});
      LOG[k]=r;saveMonthOf(k);
      if(n){NOTES[k]=n;sSet('n_'+k,n)}else{delete NOTES[k];sDel('n_'+k)}
      closeSheet();haptic('success');toast(k===TK?'Сегодня обновлено':'День сохранён');
      if(k===TK)wasClosed=dayStats(TODAY).ratio>=1;
      render();
    };
  }
  openSheet('');draw();
}

/* ---------- Отправка отметок Грете ---------- */
var syncTimers={};
function pendingFor(k){
  var d=fromKey(k),r=LOG[k]||{},out=[];
  DATA.habits.forEach(function(h){if(appliesDaily(h,d)&&!isDone(h,r))out.push(h.title)});
  return out;
}
function syncDay(k){
  var url=DATA&&DATA.settings&&DATA.settings.syncUrl;if(!url)return;
  clearTimeout(syncTimers[k]);
  syncTimers[k]=setTimeout(function(){
    var s=dayStats(fromKey(k));
    try{
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initData:tg?tg.initData:'',date:k,record:LOG[k]||{},done:s.done,total:s.total,pending:pendingFor(k)})
      }).catch(function(){});
    }catch(e){}
  },1200);
}

/* ---------- Celebrate / toast ---------- */
var $cel=document.getElementById('celebrate');document.getElementById('celOrb').innerHTML=I.spark;
function celebrate(){
  var card=$cel.querySelector('.cel-card');card.querySelectorAll('.spark').forEach(function(s){s.remove()});
  for(var i=0;i<16;i++){var s=document.createElement('i');s.className='spark';var a=i/16*Math.PI*2,d=110+Math.random()*60;
    s.style.background=i%2?cssv('--accent'):cssv('--water');s.style.left='50%';s.style.top='64px';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=(Math.random()*.15)+'s';card.appendChild(s)}
  $cel.classList.add('show');haptic('success');
}
document.getElementById('celClose').onclick=function(){$cel.classList.remove('show')};
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2000)}

/* ---------- Load ---------- */
function showError(){
  $app.innerHTML='<section class="empty glass"><div class="orb">'+I.cloud+'</div><h3>Не получилось загрузить данные</h3>'+
   '<p>Файл data.json не открылся. Проверь интернет и что файл лежит рядом с index.html, затем попробуй ещё раз.</p>'+
   '<button class="pill-btn" id="retry" style="padding-right:24px"><span class="ic">'+I.arrow+'</span>Повторить</button></section>';
  document.getElementById('retry').onclick=function(){$app.innerHTML='<div class="skeleton" style="height:132px;border-radius:30px"></div>';load()};
}
function load(){
  fetch('data.json?v='+Date.now(),{cache:'no-store'})
   .then(function(res){if(!res.ok)throw new Error(res.status);return res.json()})
   .then(function(json){
     if(!json||!Array.isArray(json.habits)||!json.settings)throw new Error('bad data');
     DATA=json;habitsById={};DATA.habits.forEach(function(h){habitsById[h.id]=h});
     header();
     var prev=addDays(new Date(TODAY.getFullYear(),TODAY.getMonth(),1),-1);
     return Promise.all([loadMonth(prev.getFullYear(),prev.getMonth()),loadMonth(TODAY.getFullYear(),TODAY.getMonth()),sGet('book')]);
   })
   .then(function(v){
     if(DATA.settings.demoMode&&Array.isArray(DATA.demoLog)){
       DATA.demoLog.forEach(function(d){
         var k=key(addDays(TODAY,parseInt(d.date,10)||0));
         if(!LOG[k]){var rec={};Object.keys(d).forEach(function(f){if(f!=='date'&&f!=='note')rec[f]=d[f]});LOG[k]=rec}
         if(d.note&&!NOTES[k])NOTES[k]=d.note;
         if(Array.isArray(d.gratitude)&&!GRAT[k]){GRAT[k]=d.gratitude.slice();LOG[k].gratitude=d.gratitude.filter(function(x){return x&&x.trim()}).length}
       });
     }
     var rs=DATA.settings.reading||{};
     try{BOOK=v[2]?JSON.parse(v[2]):null}catch(e){BOOK=null}
     if(!BOOK)BOOK={title:rs.currentBook||'',total:rs.bookTotalPages||null,pagesRead:rs.bookPagesBefore||0};
     wasClosed=dayStats(TODAY).ratio>=1;
     $nav.hidden=false;render();
     sGet('skin').then(function(s){var id=(s&&SKINS[s])?s:((DATA.settings.theme&&SKINS[DATA.settings.theme])?DATA.settings.theme:'creme');if(id!==SKIN){applySkin(id);render()}});
   })
   .catch(function(){showError()});
}
applySkin((function(){var s=lGet('skin');return (s&&SKINS[s])?s:'creme'})());
header();load();
})();
</script>
